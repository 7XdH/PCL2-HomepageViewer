name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # A CSP copy that drifts from api/security-headers.js silently weakens a
      # deploy, so fail before building anything.
      - name: Check security header copies
        run: npm run headers

      # npm test drives a real Chromium through CDP; runner images no longer ship
      # one, so install it and point the harness at the binary explicitly.
      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run regression tests
        run: npm test
        env:
          PCL_TEST_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Build static site
        run: npm run build

      # Copying files proves nothing; render the built site once before upload.
      - name: Smoke test the build
        run: node tools/smoke-dist.mjs
        env:
          PCL_TEST_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
