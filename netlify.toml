[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), geolocation=(), microphone=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=(), clipboard-read=(), clipboard-write=(self)"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"
    Strict-Transport-Security = "max-age=31536000"

[[headers]]
  for = "/"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https: http:; font-src 'self' data:; connect-src 'self' https: http:; media-src 'self' https: http:; manifest-src 'self'; worker-src 'self' blob:; frame-src 'none'"

[[headers]]
  for = "/index.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https: http:; font-src 'self' data:; connect-src 'self' https: http:; media-src 'self' https: http:; manifest-src 'self'; worker-src 'self' blob:; frame-src 'none'"

[[headers]]
  for = "/*.xaml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
